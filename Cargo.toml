[package]
name = "latencydevil"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "GPU-aware environment wrapper: injects Wayland/low-latency variables (plus NVIDIA Reflex extras) into a wrapped command"
license = "Apache-2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
